<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CSCA · Математика</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231A2238'/%3E%3Ctext x='32' y='45' font-family='Georgia, serif' font-size='38' font-weight='700' fill='%23E3B23C' text-anchor='middle'%3E%CF%80%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231A2238'/%3E%3Ctext x='32' y='45' font-family='Georgia, serif' font-size='38' font-weight='700' fill='%23E3B23C' text-anchor='middle'%3E%CF%80%3C/text%3E%3C/svg%3E">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#12182A;
    --bg-card:#1A2238;
    --bg-card-alt:#212B47;
    --bg-sidebar:#0D1220;
    --text:#F1EEE4;
    --text-dim:#9AA3C2;
    --accent:#E3B23C;
    --teal:#48A897;
    --coral:#E07A6B;
    --line:#2C355A;
    --radius:14px;
    --font-display:'Fraunces', serif;
    --font-body:'Inter', sans-serif;
    --font-mono:'IBM Plex Mono', monospace;
    --sidebar-w:270px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg); color:var(--text); font-family:var(--font-body);}

  .shell{display:flex; min-height:100vh; max-width:920px; margin:0 auto;}

  aside.sidebar{
    width:var(--sidebar-w); flex-shrink:0; background:var(--bg-sidebar);
    border-right:1px solid var(--line); padding:22px 16px;
    position:fixed; top:0; bottom:0; left:0; overflow-y:auto;
    transform:translateX(0); transition:transform .25s ease; z-index:40;
  }
  .sidebar-brand{font-family:var(--font-display); font-weight:600; font-size:19px; margin-bottom:2px;}
  .sidebar-sub{font-family:var(--font-mono); font-size:11px; color:var(--accent); letter-spacing:.08em; text-transform:uppercase; margin-bottom:22px;}

  .tree-module{margin-bottom:6px;}
  .tree-module-head{display:flex; align-items:center; gap:8px; padding:9px 8px; border-radius:8px; font-size:14.5px; font-weight:600; color:var(--text); cursor:pointer; user-select:none;}
  .tree-module-head:hover{background:rgba(255,255,255,0.03);}
  .tree-module-head .idx{font-family:var(--font-mono); font-size:11px; color:var(--accent); background:rgba(227,178,60,0.12); border-radius:5px; padding:1px 6px; flex-shrink:0;}
  .tree-module-head .head-title{flex:1; min-width:0;}
  .tree-module-head .chevron{font-size:10px; color:var(--text-dim); flex-shrink:0; transition:transform .22s ease; margin-left:2px;}
  .tree-module.expanded .tree-module-head .chevron{transform:rotate(180deg); color:var(--accent);}
  .tree-children{overflow:hidden; max-height:0; margin:0; padding-left:10px; transition:max-height .28s ease, margin .28s ease;}
  .tree-module.expanded .tree-children{max-height:1200px; margin-top:2px; margin-bottom:8px;}
  .tree-item{display:flex; align-items:center; gap:9px; padding:9px 10px 9px 14px; margin:2px 0; border-left:2px solid transparent; border-radius:0 8px 8px 0; font-size:14px; color:var(--text-dim); cursor:pointer;}
  .tree-item:hover{color:var(--text);}
  .tree-item.active{color:var(--accent); border-left-color:var(--accent); background:rgba(227,178,60,0.08); font-weight:600;}
  .tree-item .dot{width:5px; height:5px; border-radius:50%; background:currentColor; flex-shrink:0;}
  .tree-item.locked-item{cursor:default; pointer-events:none;}
  .tree-item.locked-item .lock-mini{margin-left:auto; font-size:11px; opacity:.7;}

  .tree-module.locked .tree-module-head{color:var(--text-dim); cursor:default;}
  .tree-module.locked .tree-module-head .lock{margin-left:auto; font-size:12px;}
  .tree-module.locked .tree-module-head .idx{background:rgba(154,163,194,0.1); color:var(--text-dim);}

  .sidebar-backdrop{display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:30;}

  .main-col{flex:1; margin-left:var(--sidebar-w); min-width:0; padding-bottom:60px;}
  .topbar{display:none; align-items:center; gap:12px; padding:16px 18px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--bg); z-index:20;}
  .burger{width:34px; height:34px; border-radius:8px; border:1px solid var(--line); background:var(--bg-card); color:var(--text); font-size:15px; cursor:pointer;}
  .topbar-title{font-family:var(--font-display); font-weight:600; font-size:16px;}

  main{padding:26px 26px 40px;}
  .content-head{margin-bottom:20px;}
  .content-eyebrow{font-family:var(--font-mono); font-size:12px; color:var(--accent); letter-spacing:.08em; text-transform:uppercase; margin-bottom:6px;}
  .content-title{font-family:var(--font-display); font-size:28px; font-weight:600; letter-spacing:-.01em;}

  .local-tabs{display:flex; gap:6px; margin-bottom:20px; flex-wrap:wrap;}
  .local-tab{background:var(--bg-card-alt); border:1px solid var(--line); color:var(--text-dim); border-radius:20px; padding:7px 14px; font-size:13.5px; font-weight:600; cursor:pointer;}
  .local-tab.active{background:var(--accent); color:#12182A; border-color:var(--accent);}

  .exam-entry{
    display:flex; align-items:center; gap:10px;
    background:linear-gradient(135deg, rgba(227,178,60,0.14), rgba(72,168,151,0.10));
    border:1px solid var(--accent);
    border-radius:12px;
    padding:12px 14px;
    margin-bottom:18px;
    cursor:pointer;
  }
  .exam-entry-icon{font-size:20px;}
  .exam-entry-title{font-weight:700; font-size:14.5px; color:var(--text);}
  .exam-entry-sub{font-family:var(--font-mono); font-size:11.5px; color:var(--accent);}

  .exam-intro{max-width:480px;}
  .exam-intro .card{margin-bottom:16px;}
  .exam-start-btn{
    background:var(--accent); color:#12182A; border:none; border-radius:10px;
    padding:15px 24px; font-family:var(--font-body); font-weight:700; font-size:15.5px; cursor:pointer;
  }

  .exam-topbar{
    display:flex; justify-content:space-between; align-items:center;
    margin-bottom:18px; max-width:480px; flex-wrap:wrap; gap:10px;
  }
  .exam-timer{
    font-family:var(--font-mono); font-size:15px; font-weight:600;
    background:var(--bg-card-alt); border:1px solid var(--line); border-radius:8px;
    padding:6px 12px; color:var(--accent);
  }
  .exam-timer.low{color:var(--coral); border-color:var(--coral);}
  .exam-nav{display:flex; gap:8px; max-width:480px; margin-top:14px;}
  .exam-nav button{
    flex:1; background:var(--bg-card-alt); border:1px solid var(--line); color:var(--text);
    border-radius:10px; padding:12px; font-family:var(--font-body); font-weight:600; font-size:14px; cursor:pointer;
  }
  .exam-nav button.primary{background:var(--accent); color:#12182A; border-color:var(--accent);}
  .exam-nav button:disabled{opacity:0.4; cursor:default;}

  .exam-opt{display:flex; align-items:center; gap:10px; background:var(--bg-card-alt); border:1px solid var(--line); border-radius:10px; padding:12px 14px; font-size:14.5px; cursor:pointer; margin-bottom:8px; max-width:480px;}
  .exam-opt.picked{border-color:var(--accent); background:rgba(227,178,60,0.10);}
  .exam-opt .letter{font-family:var(--font-mono); font-size:12px; color:var(--text-dim); width:20px; height:20px; border-radius:50%; border:1px solid var(--line); display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .exam-opt.picked .letter{border-color:var(--accent); color:var(--accent);}

  .exam-result-score{font-family:var(--font-display); font-size:48px; font-weight:700; color:var(--accent); margin-bottom:4px;}
  .exam-review-item{background:var(--bg-card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:10px; max-width:560px;}
  .exam-review-item .rq{font-size:14.5px; font-weight:600; margin-bottom:8px;}
  .exam-review-item .ra{font-size:13.5px; margin-bottom:4px;}
  .exam-review-item .ra.correct-ans{color:var(--teal);}
  .exam-review-item .ra.wrong-ans{color:var(--coral);}
  .exam-review-item .rex{font-size:13px; color:var(--text-dim); margin-top:8px; padding-top:8px; border-top:1px dashed var(--line);}

  @keyframes fade{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;}}
  #contentBody{animation:fade .25s ease;}

  .lead{font-size:15.5px; line-height:1.6; margin-bottom:18px;}
  .lead b{color:var(--accent); font-weight:600;}
  .card{background:var(--bg-card); border:1px solid var(--line); border-radius:var(--radius); padding:18px; margin-bottom:14px;}
  .card h3{font-family:var(--font-display); font-size:18px; font-weight:600; margin:0 0 8px; display:flex; align-items:center; gap:8px;}
  .card h3 .num{font-family:var(--font-mono); font-size:12px; color:var(--accent); background:rgba(227,178,60,0.12); border-radius:6px; padding:2px 7px;}
  .card p{font-size:14.5px; line-height:1.6; color:var(--text-dim); margin:0 0 8px;}
  .card p:last-child{margin-bottom:0;}
  .formula{font-family:var(--font-mono); background:var(--bg-card-alt); border-radius:8px; padding:8px 12px; display:inline-block; font-size:14px; color:var(--accent); margin:4px 6px 4px 0;}
  .num-sets{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px;}
  .num-sets span{font-family:var(--font-mono); font-size:13px; background:var(--bg-card-alt); border:1px solid var(--line); border-radius:8px; padding:6px 10px; color:var(--text);}
  .num-sets span b{color:var(--accent);}

  .widget-wrap{background:var(--bg-card); border:1px solid var(--line); border-radius:var(--radius); padding:18px; margin-bottom:14px;}
  .widget-wrap h3{font-family:var(--font-display); font-size:18px; font-weight:600; margin:0 0 4px;}
  .widget-wrap .hint{font-size:13px; color:var(--text-dim); margin-bottom:14px;}
  .widget-ops{display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-bottom:16px; max-width:360px;}
  .widget-ops.three{grid-template-columns:repeat(3,1fr);}
  .widget-ops button{background:var(--bg-card-alt); border:1px solid var(--line); color:var(--text); border-radius:8px; padding:9px 4px; font-family:var(--font-mono); font-size:13px; cursor:pointer;}
  .widget-ops button.active{background:var(--accent); color:#12182A; border-color:var(--accent); font-weight:600;}
  #widgetLabel{font-family:var(--font-mono); font-size:14px; color:var(--accent); margin-top:12px; min-height:20px;}

  .glossary-item{background:var(--bg-card); border:1px solid var(--line); border-radius:var(--radius); padding:15px 16px; margin-bottom:10px; cursor:pointer; max-width:480px;}
  .glossary-item .row{display:flex; justify-content:space-between; align-items:center;}
  .glossary-item .term{font-size:15.5px; font-weight:600;}
  .glossary-item .en{font-family:var(--font-mono); font-size:12.5px; color:var(--accent);}
  .glossary-item .expl{max-height:0; overflow:hidden; transition:max-height .25s ease;}
  .glossary-item.open .expl{max-height:140px; margin-top:10px;}
  .glossary-item .expl p{font-size:13.5px; color:var(--text-dim); line-height:1.55; margin:0;}
  .glossary-item .chev{color:var(--text-dim); font-size:13px; transition:transform .2s;}
  .glossary-item.open .chev{transform:rotate(180deg);}

  .progress{display:flex; gap:5px; margin-bottom:16px; max-width:420px;}
  .progress .seg{flex:1; height:4px; border-radius:3px; background:var(--line); cursor:pointer; transition:transform .15s ease;}
  .progress .seg:hover{transform:scaleY(1.6);}
  .progress .seg.correct{background:var(--teal);}
  .progress .seg.wrong{background:var(--coral);}
  .progress .seg.skipped{background:var(--accent);}
  .progress .seg.current{background:var(--text-dim); cursor:default;}
  .progress .seg.upcoming{cursor:default;}
  .progress .seg.viewing{outline:2px solid var(--text); outline-offset:1px;}

  /* question paging arrows */
  .q-nav-row{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px;}
  .q-nav-arrow{
    width:32px; height:32px; flex-shrink:0; border-radius:8px; border:1px solid var(--line);
    background:var(--bg-card-alt); color:var(--text); font-size:15px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .q-nav-arrow:disabled{opacity:.3; cursor:default;}
  .q-nav-arrow:not(:disabled):hover{border-color:var(--accent); color:var(--accent);}
  .review-banner{
    font-family:var(--font-mono); font-size:11.5px; letter-spacing:.04em; text-transform:uppercase;
    text-align:center; margin-bottom:2px;
  }
  .review-banner.correct{color:var(--teal);}
  .review-banner.wrong{color:var(--coral);}
  .review-banner.skipped{color:var(--accent);}

  /* module progress bar in sidebar */
  .module-progress{display:flex; align-items:center; gap:7px; padding:0 8px 8px; margin-top:-2px;}
  .module-progress-bar{flex:1; height:3px; border-radius:2px; background:var(--line); overflow:hidden;}
  .module-progress-fill{height:100%; background:var(--teal); border-radius:2px; transition:width .3s ease;}
  .module-progress-text{font-family:var(--font-mono); font-size:10.5px; color:var(--text-dim); flex-shrink:0;}

  /* merged status card: readiness + streak + exam countdown + exam entry */
  .status-card{
    background:var(--bg-card);
    border:1px solid var(--line);
    border-radius:12px;
    padding:12px 14px;
    margin-bottom:18px;
  }
  .status-head{display:flex; align-items:center; justify-content:space-between; gap:10px; cursor:pointer; margin-bottom:10px;}
  .status-title{font-weight:700; font-size:14.5px; color:var(--text);}
  .progress-entry-sub{font-family:var(--font-mono); font-size:11.5px; color:var(--text-dim); margin-top:1px;}
  .status-pct{font-family:var(--font-mono); font-size:15px; font-weight:700; color:var(--teal); flex-shrink:0;}
  .status-bar{height:5px; border-radius:3px; background:var(--line); overflow:hidden; margin-bottom:10px;}
  .status-bar-fill{height:100%; background:var(--teal); border-radius:3px; transition:width .3s ease; width:0%;}
  .status-stats{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:10px; flex-wrap:wrap;}
  .status-stat{font-family:var(--font-mono); font-size:11px; color:var(--text-dim);}
  .status-stat.clickable{cursor:pointer; text-decoration:underline dotted; text-underline-offset:2px;}
  .status-stat.clickable:hover{color:var(--accent);}
  .status-date-input{
    font-family:var(--font-mono); font-size:11px; background:var(--bg-card-alt);
    border:1px solid var(--line); border-radius:6px; color:var(--text); padding:2px 4px;
  }
  .status-card .exam-entry{margin-bottom:0;}

  /* module weight badge in sidebar tree */
  .weight-badge{
    font-family:var(--font-mono); font-size:10px; color:var(--text-dim);
    background:rgba(154,163,194,0.12); border-radius:5px; padding:1px 6px;
    flex-shrink:0; margin-left:auto;
  }

  .overall-progress-card{background:var(--bg-card); border:1px solid var(--line); border-radius:var(--radius); padding:22px; margin-bottom:18px; max-width:480px;}
  .overall-progress-pct{font-family:var(--font-display); font-size:44px; font-weight:700; color:var(--teal);}
  .overall-progress-label{font-size:13.5px; color:var(--text-dim); margin-bottom:14px;}
  .overall-progress-bar{height:8px; border-radius:4px; background:var(--line); overflow:hidden;}
  .overall-progress-fill{height:100%; background:var(--teal); border-radius:4px; transition:width .4s ease;}

  .module-progress-row{background:var(--bg-card); border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin-bottom:8px; max-width:480px;}
  .module-progress-row .mp-top{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;}
  .module-progress-row .mp-name{font-size:14.5px; font-weight:600;}
  .module-progress-row .mp-frac{font-family:var(--font-mono); font-size:12px; color:var(--text-dim);}
  .module-progress-row .module-progress-bar{height:5px;}

  .q-card{background:var(--bg-card); border:1px solid var(--line); border-radius:var(--radius); padding:20px; max-width:480px;}
  .q-eyebrow{font-family:var(--font-mono); font-size:12px; color:var(--text-dim); margin-bottom:10px;}
  .q-nav-row .q-eyebrow{margin-bottom:0;}
  .q-text{font-family:var(--font-display); font-size:19px; font-weight:600; line-height:1.35; margin-bottom:16px;}
  .q-text-block{margin-bottom:16px;}
  .q-text-zh{font-family:var(--font-display); font-size:18px; font-weight:600; line-height:1.4; margin-bottom:3px;}
  .q-text-en{font-family:var(--font-display); font-size:15.5px; font-weight:500; line-height:1.4; margin-bottom:9px; color:var(--text-dim);}
  .q-text-ru{font-size:13.5px; line-height:1.45; color:var(--text-dim); padding-top:9px; border-top:1px dashed var(--line);}
  .options{display:flex; flex-direction:column; gap:8px; margin-bottom:6px;}
  .opt{display:flex; align-items:flex-start; gap:10px; background:var(--bg-card-alt); border:1px solid var(--line); border-radius:10px; padding:12px 14px; font-size:14.5px; cursor:pointer;}
  .opt .letter{margin-top:1px;}
  .opt-multi{display:flex; flex-direction:column; gap:2px;}
  .opt-zh{font-size:14.5px;}
  .opt-en{font-size:12.5px; color:var(--text-dim);}
  .opt-ru{font-size:12px; color:var(--text-dim); font-style:italic;}
  .opt .letter{font-family:var(--font-mono); font-size:12px; color:var(--text-dim); width:20px; height:20px; border-radius:50%; border:1px solid var(--line); display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .opt.correct{border-color:var(--teal); background:rgba(72,168,151,0.12);}
  .opt.correct .letter{border-color:var(--teal); color:var(--teal);}
  .opt.wrong{border-color:var(--coral); background:rgba(224,122,107,0.12);}
  .opt.wrong .letter{border-color:var(--coral); color:var(--coral);}
  .opt.disabled{pointer-events:none;}
  .explain{margin-top:16px; padding-top:16px; border-top:1px dashed var(--line); display:none;}
  .explain.show{display:block; animation:fade .25s ease;}
  .explain .tag{font-family:var(--font-mono); font-size:11.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--accent); margin-bottom:6px;}
  .explain p{font-size:14px; line-height:1.6; color:var(--text); margin:0;}
  .next-btn{width:100%; margin-top:16px; background:var(--accent); color:#12182A; border:none; border-radius:10px; padding:14px; font-family:var(--font-body); font-weight:700; font-size:15px; cursor:pointer; display:none;}
  .next-btn.show{display:block;}
  .skip-row{margin-top:14px; text-align:center;}
  .skip-btn{background:transparent; color:var(--text-dim); border:1px solid var(--line); border-radius:10px; padding:11px 18px; font-family:var(--font-body); font-weight:600; font-size:13.5px; cursor:pointer;}
  .skip-btn:hover{border-color:var(--text-dim); color:var(--text);}
  .skip-hint{margin-top:8px; font-size:11.5px; color:var(--text-dim); opacity:.7;}
  .q-card{touch-action:pan-y;}
  .q-card.swiping{transition:transform .15s ease, opacity .15s ease;}
  .done-card{text-align:center; padding:40px 20px;}
  .done-card .score{font-family:var(--font-display); font-size:44px; font-weight:700; color:var(--accent); margin-bottom:6px;}
  .done-card p{color:var(--text-dim); font-size:14.5px;}
  .retry-btn{margin-top:18px; background:none; border:1px solid var(--line); color:var(--text); border-radius:10px; padding:12px 20px; font-size:14px; cursor:pointer;}

  @media (max-width: 760px){
    aside.sidebar{transform:translateX(-100%);}
    aside.sidebar.open{transform:translateX(0);}
    .sidebar-backdrop.show{display:block;}
    .main-col{margin-left:0;}
    .topbar{display:flex;}
    main{padding:20px 18px 40px;}
    .content-title{font-size:24px;}
  }
</style>
</head>
<body>

<div id="paywallOverlay" style="display:none;position:fixed;inset:0;z-index:9999;background:#0b0f1f;color:#fff;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;font-family:inherit;">
  <div style="font-size:48px;margin-bottom:16px;">🔒</div>
  <div style="font-size:20px;font-weight:700;margin-bottom:8px;">Доступ к курсу закрыт</div>

<script>
let tg = null;
try{
  tg = window.Telegram && window.Telegram.WebApp;
  if(tg){ tg.ready(); tg.expand(); }
}catch(e){}

(function(){
  const shell = document.getElementById('appShell');
  const loading = document.getElementById('appLoading');
  const overlay = document.getElementById('paywallOverlay');
  const buyBtn = document.getElementById('paywallBuyBtn');
  const statusEl = document.getElementById('paywallStatus');
  const initData = tg ? tg.initData : '';

  function showApp(){
    loading.style.display = 'none';
    overlay.style.display = 'none';
    shell.style.display = '';
  }
  function showPaywall(msg){
    loading.style.display = 'none';
    shell.style.display = 'none';
    overlay.style.display = 'flex';
    if(msg) statusEl.textContent = msg;
  }

  function checkAccess(){
    fetch('/api/check-access', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ initData: initData || '' })
    }).then(r=>r.json()).then(function(data){
      if(data.paid){
        showApp();
      } else if(!data.valid){
        showPaywall('Открой курс через бота в Telegram — это нужно для проверки оплаты.');
        buyBtn.style.display = 'none';
      } else {
        showPaywall('');
      }
    }).catch(function(){
      showPaywall('Не удалось проверить доступ. Попробуй ещё раз позже.');
    });
  }

  if(buyBtn){
    buyBtn.addEventListener('click', function(){
      buyBtn.disabled = true;
      statusEl.textContent = 'Открываю оплату…';
      fetch('/api/create-invoice-link', { method: 'POST' })
        .then(r=>r.json())
        .then(function(data){
          if(!data.link){ statusEl.textContent = 'Ошибка. Попробуй снова.'; buyBtn.disabled = false; return; }
          if(tg && tg.openInvoice){
            tg.openInvoice(data.link, function(status){
              buyBtn.disabled = false;
              if(status === 'paid'){
                statusEl.textContent = 'Оплата прошла! Открываю курс…';
                checkAccess();
              } else if(status === 'cancelled'){
                statusEl.textContent = '';
              } else {
                statusEl.textContent = 'Оплата не завершена.';
              }
            });
          } else {
            statusEl.textContent = 'Открой это приложение через Telegram, чтобы оплатить.';
            buyBtn.disabled = false;
          }
        }).catch(function(){
          statusEl.textContent = 'Ошибка сети. Попробуй снова.';
          buyBtn.disabled = false;
        });
    });
  }

  checkAccess();
})();

        title: 'Квадратичные и дробные неравенства',
        theoryHTML: `
          <p class="lead">Неравенство показывает, что одно выражение <b>больше, меньше, больше-равно или меньше-равно</b> другого. Решить неравенство — значит найти все значения переменной, при которых оно верно.</p>

          <div class="card">
            <h3><span class="num">3.1</span>Квадратные неравенства и метод интервалов</h3>
            <p>Сначала находим корни уравнения — тремя способами (любым удобным):</p>
            <p>1) <b>Разложить на множители:</b> <span class="formula">x² − 5x + 6 = (x − 2)(x − 3)</span> — произведение равно 0 при x = 2 и x = 3</p>
            <p>2) <b>Через дискриминант:</b> <span class="formula">x = (5 ± √(25 − 24)) / 2 = (5 ± 1) / 2</span> → те же корни 2 и 3</p>
            <p>3) <b>Подобрать из вариантов ответа</b>, если задание с выбором (на экзамене это часто самый быстрый путь)</p>
            <p>Корни делят числовую прямую на промежутки. В каждом промежутке знак выражения постоянен — определяем его по направлению ветвей параболы. Сами корни включаются в ответ только если неравенство нестрогое (≥ или ≤).</p>
            <p><span class="formula">x² − 5x + 6 &gt; 0</span> → корни 2 и 3, парабола вверх → вне корней выражение положительно → <span class="formula">x ∈ (−∞; 2) ∪ (3; +∞)</span> (сами точки 2 и 3 не входят — неравенство строгое)</p>
          </div>

          <div class="card">
            <h3><span class="num">3.2</span>Дробно-рациональные неравенства</h3>
            <p>Тот же метод интервалов, но точки, где знаменатель обращается в ноль, всегда <b>исключаются</b> из ответа (там выражение не определено), даже если неравенство нестрогое.</p>
            <p><span class="formula">(x − 1)/(x + 2) ≥ 0</span> → x = 1 включаем (числитель = 0 допустимо), x = −2 исключаем (знаменатель = 0) → <span class="formula">x ∈ (−∞; −2) ∪ [1; +∞)</span></p>
          </div>

          <div class="card">
            <h3><span class="num">3.2b</span>Если справа не ноль</h3>
            <p>Частая ловушка на экзамене: неравенство вида <span class="formula">(x + 1)/(x − 4) ≥ 1</span> — справа стоит не 0. Метод интервалов работает только когда одна часть равна нулю, поэтому <b>сначала переносим всё в одну сторону</b> и приводим к общему знаменателю. Нельзя просто домножать обе части на (x − 4) — знак этого выражения неизвестен (зависит от x), и неравенство может «перевернуться».</p>
            <p><span class="formula">(x + 1)/(x − 4) ≥ 1  →  (x + 1)/(x − 4) − 1 ≥ 0  →  [(x + 1) − (x − 4)] / (x − 4) ≥ 0  →  5/(x − 4) ≥ 0</span></p>
            <p>Числитель — это положительная константа 5, значит знак дроби целиком определяется знаменателем: дробь положительна (или равна нулю — но 5/(x−4) в ноль не обращается никогда), когда <b>x − 4 &gt; 0</b>. Точка x = 4 всегда исключается (знаменатель).</p>
            <p>Ответ: <span class="formula">x ∈ (4; +∞)</span></p>
          </div>

          <div class="widget-wrap">
            <h3>Числовая прямая</h3>

            <div id="widgetLabel">x² − 5x + 6 &gt; 0 → x ∈ (−∞; 2) ∪ (3; +∞)</div>

        id: 'func-domain-range',
        title: 'Область определения и область значений функции',
        theoryHTML: `
          <p class="lead">Функция сопоставляет каждому значению x ровно одно значение y. <b>Область определения</b> — это все допустимые x, <b>область значений</b> — все возможные y.</p>
          <div class="card">
            <h3><span class="num">4.1</span>Что ограничивает область определения</h3>
            <p>Знаменатель дроби <b>не может быть равен нулю</b>.</p>
            <p>Выражение под корнём чётной степени <b>не может быть отрицательным</b>.</p>
            <p>Аргумент логарифма <b>должен быть строго положительным</b>.</p>
          </div>
          <div class="card">
            <h3><span class="num">4.2</span>Примеры</h3>
            <p><span class="formula">f(x) = 1/(x − 2)</span> → x ≠ 2 → D(f) = R \\ {2}</p>
            <p><span class="formula">f(x) = √(x − 3)</span> → x − 3 ≥ 0 → D(f) = [3; +∞)</p>
            <p><span class="formula">f(x) = log(x + 1)</span> → x + 1 &gt; 0 → D(f) = (−1; +∞)</p>
          </div>
          <div class="card">
            <h3><span class="num">4.2b</span>Когда правила комбинируются</h3>
            <p>Если корень чётной степени стоит <b>в знаменателе</b>, оба ограничения складываются в одно, но неравенство становится <b>строгим</b>: выражение под корнём должно быть не просто ≥0, а &gt;0, иначе знаменатель обратится в 0.</p>
            <p><span class="formula">f(x) = 1/√(x − 2)</span> → нужно x − 2 &gt; 0 (не ≥0!) → D(f) = (2; +∞)</p>
          </div>
          <div class="card">
            <h3><span class="num">4.2c</span>Как найти область значений</h3>
            <p>Единого универсального алгоритма нет, но на практике на экзамене чаще всего работают так: если функция — стандартная (парабола, корень, дробь, экспонента), вспоминаем её типовое поведение. Например, <span class="formula">y = x²</span> при x ∈ R — квадрат любого числа неотрицателен и может быть сколь угодно большим, значит область значений E(f) = [0; +∞). Для более сложных функций смотрят на монотонность и предельные значения на границах области определения.</p>
          </div>
          <div class="card">
            <h3><span class="num">4.2d</span>Комбинация: корень не в знаменателе</h3>
            <p>Если корень стоит в числителе дроби (а не в знаменателе), условия для корня и для знаменателя не усиливают друг друга — они просто объединяются в систему, каждое само по себе: подкоренное выражение ≥ 0 (нестрого!), и отдельно знаменатель ≠ 0.</p>
            <p>Пример: <span class="formula">f(x) = √(x + 4)/(x − 2)</span>. Система: <span class="formula">x + 4 ≥ 0</span> (то есть x ≥ −4) и отдельно <span class="formula">x − 2 ≠ 0</span> (то есть x ≠ 2). Ответ: D(f) = [−4; 2) ∪ (2; +∞).</p>
          </div>
          <div class="card">
            <h3><span class="num">4.3</span>Область значений по типу функции</h3>
            <p><b>Линейная</b> y = kx + b (k≠0): график — прямая, уходит в обе бесконечности, принимает любые значения: E(f) = R. Если k = 0, функция постоянна: E(f) = {b}.</p>
            <p><b>Квадратичная</b> y = ax² + bx + c: находим вершину x₀ = −b/(2a), y₀ = f(x₀). При a &gt; 0 (ветви вверх): E(f) = [y₀; +∞). При a &lt; 0 (ветви вниз): E(f) = (−∞; y₀].</p>
            <p><b>Чётная степень</b> y = ax²ⁿ + c (например x², x⁴): минимум базовой x²ⁿ равен 0 при x=0, значит при a &gt; 0 получаем E(f) = [c; +∞), а при a &lt; 0 — E(f) = (−∞; c].</p>
            <p><b>Нечётная степень</b> y = x²ⁿ⁺¹ (например x, x³): принимает все значения, E(f) = R.</p>
            <p><b>Квадратный корень</b> y = √(g(x)) + k: минимум корня равен 0 (если 0 входит в область значений g), значит минимум всей функции равен k: E(f) = [k; +∞).</p>
            <p><b>Модуль</b> y = a|x−b| + c: при a &gt; 0 минимум c, E(f) = [c; +∞); при a &lt; 0 максимум c, E(f) = (−∞; c].</p>
            <p><b>Дробно-рациональная (гипербола)</b> y = k/(x−a) + b: принимает любые значения, кроме значения горизонтальной асимптоты y = b, потому что дробь k/(x−a) никогда не обращается в 0 (при k ≠ 0).</p>
          </div>
          <div class="card">
            <h3><span class="num">4.3b</span>Оценка через неравенства</h3>
            <p>Если функцию сложно отнести к стандартному типу, можно оценить её сверху или снизу неравенствами. Например, для <span class="formula">y = (x − 1)² + 4</span> известно, что (x−1)² ≥ 0 при любом x, значит y ≥ 4; а поскольку (x−1)² может расти неограниченно, сверху функция не ограничена. Ответ: E(f) = [4; +∞).</p>
          </div>
          <div class="card">
            <h3><span class="num">4.4</span>Частые ошибки</h3>
            <p><b>Путаница скобок.</b> Круглая скобка означает, что граница не включается (строгое неравенство или бесконечность), квадратная — что включается. Бесконечность всегда пишется только с круглой скобкой.</p>
            <p><b>Забытый знаменатель.</b> Если корень в числителе — достаточно g(x) ≥ 0. Но если этот же корень стоит в знаменателе всей дроби, условие ужесточается до g(x) &gt; 0 (строго), потому что ноль в знаменателе тоже запрещён.</p>
            <p><b>Неверное направление ветвей.</b> Перед тем как писать E(f) для параболы, обязательно проверяйте знак a — от него зависит, ограничена область значений сверху или снизу.</p>
            <p><b>Сужение области после сокращения дроби.</b> Если в функции можно сократить общий множитель в числителе и знаменателе, область определения всё равно нужно искать по <b>исходной</b> формуле, а не по уже упрощённой — сокращение «прячет» точку, которая была запрещена изначально.</p>
            <p>Пример: <span class="formula">y = (x² − 16)/(x − 4)</span>. После сокращения (x−4)(x+4)/(x−4) получаем y = x + 4, которая выглядит определённой всюду. Но в исходной функции знаменатель x − 4 не мог быть равен нулю, значит x ≠ 4 сохраняется и в ответе: D(f) = R \\ {4}, а не R.</p>
          </div>

          <div class="card">
            <h3><span class="num">4.7</span>Обратная к дробно-рациональной функции</h3>
            <p>Для функции вида <span class="formula">y = (ax+b)/(cx+d)</span> алгоритм тот же, что для линейной: меняем x и y местами, а затем выражаем y — раскрываем скобки и группируем все слагаемые с y в одной части.</p>
            <p>Пример: <span class="formula">y = (2x+1)/(x−3)</span>, x≠3. Меняем местами: <span class="formula">x = (2y+1)/(y−3)</span>. Умножаем обе части на (y−3): <span class="formula">x(y−3) = 2y+1</span> → <span class="formula">xy − 3x = 2y + 1</span>. Группируем слагаемые с y слева: <span class="formula">xy − 2y = 3x + 1</span> → <span class="formula">y(x−2) = 3x+1</span> → <span class="formula">y = (3x+1)/(x−2)</span>, x≠2.</p>

        id: 'trig-reduction',
        title: 'Формулы приведения',
        theoryHTML: `
          <p class="lead">Формулы приведения выражают тригонометрические функции углов вида 90°±x, 180°±x и т.д. через функции угла x.</p>
          <div class="card">
            <h3><span class="num">5.17</span>Общее правило и примеры</h3>
            <p>Для углов 90°±x или 270°±x функция меняется на кофункцию (sin↔cos). Для 180°±x или 360°±x функция сохраняется, а знак определяется четвертью исходного угла.</p>
            <p><span class="formula">sin(180° − x) = sin x</span>, <span class="formula">cos(180° − x) = −cos x</span></p>
            <p><span class="formula">sin(180° + x) = −sin x</span>, <span class="formula">cos(360° − x) = cos x</span></p>
            <p>Напоминание про знаки по четвертям (I: всё +, II: только sin +, III: только tan +, IV: только cos +) помогает определить знак результата: например, если x — острый угол (в I четверти), то угол 180°+x попадает в III четверть, где косинус отрицателен, поэтому <span class="formula">cos(180° + x) = −cos x</span> (функция не меняется на кофункцию, так как это случай 180°±x, а знак минус — потому что III четверть).</p>
            <p>Для случая 90°+x (функция меняется на кофункцию): если x острый, угол 90°+x попадает во II четверть, где синус положителен, а косинус отрицателен. Значит <span class="formula">sin(90° + x) = cos x</span> (кофункция, и знак «+», так как в II четверти синус положителен).</p>
          </div>

          <div class="card">
            <h3><span class="num">5.17b</span>Чётность/нечётность и тангенс</h3>
            <p>Отдельно стоит запомнить формулы для <b>отрицательного угла</b> (это сразу видно из чётности функций):</p>
            <p><span class="formula">sin(−x) = −sin x</span> (синус — нечётная), <span class="formula">cos(−x) = cos x</span> (косинус — чётная), <span class="formula">tan(−x) = −tan x</span></p>
            <p>Частая ошибка — путать период синуса/косинуса (360°, то есть 2π) с периодом тангенса, который в <b>два раза короче</b>: <span class="formula">180°</span> (то есть π). Из-за этого:</p>
            <p><span class="formula">tan(180° + x) = tan x</span> — знак НЕ меняется, хотя для sin и cos на угол 180°+x знак обычно меняется. Не путай с <span class="formula">tan(180° − x) = −tan x</span>.</p>
            <p>Пример разбора: cos(360° − x) = cos(−x) = cos x — верно (используем и период 360°, и чётность косинуса одновременно).</p>
          </div>

        theoryHTML: `
          <p class="lead">Вектор задаётся координатами и имеет длину и направление.</p>
          <div class="card">
            <h3><span class="num">6.4</span>Координаты и длина вектора</h3>
            <p>Вектор AB с A(x₁;y₁), B(x₂;y₂) имеет координаты <span class="formula">(x₂−x₁; y₂−y₁)</span>. Длина: <span class="formula">|v| = √(x² + y²)</span></p>
          </div>
          <div class="card">
            <h3><span class="num">6.4b</span>Сложение и вычитание векторов</h3>
            <p><b>Правило треугольника:</b> чтобы сложить a и b, откладываем b от конца a — суммой будет вектор, идущий от начала a к концу b.</p>
            <p><b>Правило параллелограмма:</b> если a и b отложены из одной точки, их сумма — диагональ параллелограмма, построенного на этих векторах.</p>
            <p>На практике на экзамене сложение и вычитание почти всегда делают покоординатно: <span class="formula">(aₓ; a_y) ± (bₓ; b_y) = (aₓ±bₓ; a_y±b_y)</span>. Умножение на число k меняет длину в |k| раз, а направление сохраняет при k&gt;0 и меняет на противоположное при k&lt;0.</p>
          </div>
          <div class="card">
            <h3><span class="num">6.5</span>Скалярное произведение</h3>
            <p><span class="formula">a · b = x₁x₂ + y₁y₂</span>. Векторы перпендикулярны, если скалярное произведение равно 0.</p>
            <p>Полезное тождество: <span class="formula">a · a = |a|²</span> — скалярный квадрат вектора всегда равен квадрату его длины.</p>
          </div>
          <div class="card">
            <h3><span class="num">6.5a</span>Угол между векторами через косинус</h3>
            <p>Скалярное произведение также равно <span class="formula">a · b = |a||b|cos α</span>, где α — угол между векторами. Отсюда, зная координаты, можно найти сам угол: <span class="formula">cos α = (a·b) / (|a||b|)</span>.</p>
            <p>Пример: a=(1;1), b=(0;1). a·b = 1·0 + 1·1 = 1. |a| = √2, |b| = 1. cos α = 1/√2 = √2/2, значит α = 45°.</p>
          </div>
          <div class="card">
            <h3><span class="num">6.5h</span>Скалярное произведение в геометрических фигурах</h3>
            <p>Отдельный частый тип задач — векторы заданы не координатами, а сторонами и диагоналями квадрата, треугольника или трапеции. Работает та же формула <span class="formula">a·b = |a||b|cos α</span>, где α — угол именно между направлениями векторов; если оба вектора выходят из одной вершины фигуры, этот угол — просто угол фигуры в этой вершине.</p>
            <p>Пример: квадрат ABCD со стороной 6. Найти AB·AC (AC — диагональ). Диагональ квадрата <span class="formula">|AC| = 6√2</span>, а угол между стороной и диагональю, выходящими из одной вершины, всегда 45°. Тогда AB·AC = 6·6√2·cos45° = 6·6√2·(√2/2) = 36.</p>
            <p>Важно: если направления векторов меняют (например берут BD вместо DB, или второй вектор выходит не из той же точки), угол между ними может стать не углом фигуры, а его дополнением до 180°.</p>
          </div>

          <div class="card">
            <h3><span class="num">6.5b</span>Разложение вектора по базису</h3>
            <p>Часто вектор задают не координатами, а как комбинацию двух базисных векторов (например a и b на сторонах фигуры), и просят выразить через них какой-то другой вектор — используя правило треугольника (сложение векторов «по цепочке»: если идём из P в R через Q, то PR = PQ + QR) и работу с серединами отрезков.</p>
            <p>Пример: ABCD — квадрат, <span class="formula">AB = a</span>, <span class="formula">AD = b</span>, F — середина AD. Выразить CF через a и b.</p>
            <p>Так как ABCD квадрат, <span class="formula">CD = −AB = −a</span>. Идём от C к F через D: <span class="formula">CF = CD + DF</span>. F — середина AD, значит <span class="formula">DF = ½DA = −½b</span> (DA противоположен AD по направлению и равен ему по длине). Итого:</p>
            <p><span class="formula">CF = CD + DF = −a − ½b</span></p>
          </div>

          <div class="card">
            <h3><span class="num">6.5c</span>Минимизация длины вектора-комбинации (квадратичная задача)</h3>
            <p>Если вектор задан как <span class="formula">c = λa + (1−λ)b</span> с параметром λ, пробегающим все действительные числа, то нужно найти |c|² через скалярное произведение, раскрыть скобки — получится обычная <b>квадратичная функция от λ</b>, и минимум находится через вершину параболы (или выделением полного квадрата), как в обычной алгебре.</p>
            <p>Пример: |a| = 1, |b| = 1, a·b = −1/3, <span class="formula">c = λa + (1−λ)b</span>. Найти минимум |c|.</p>
            <p>Раскрываем: <span class="formula">|c|² = λ²|a|² + (1−λ)²|b|² + 2λ(1−λ)(a·b) = λ² + (1−λ)² − (2/3)λ(1−λ)</span></p>
            <p>Упрощаем: <span class="formula">|c|² = λ² + 1 − 2λ + λ² − (2/3)λ + (2/3)λ² = (8/3)λ² − (8/3)λ + 1</span></p>
            <p>Это квадратичная функция от λ с минимумом в вершине <span class="formula">λ = −b/(2a) = (8/3)/(16/3) = 1/2</span>. Значение в вершине: <span class="formula">(8/3)·(1/4) − (8/3)·(1/2) + 1 = 1/3</span>. Значит <span class="formula">min|c| = √(1/3) = √3/3</span>.</p>
          </div>

          <div class="card">
            <h3><span class="num">6.6</span>Коллинеарность точек через сложение векторов</h3>
            <p>Иногда векторы даны не координатами, а через абстрактные базисные векторы a и b (без конкретных чисел), и нужно доказать, что три точки лежат на одной прямой. Приём: сложить два «соседних» вектора и сравнить результат с третьим данным вектором — если они <b>совпадают буквально</b> (тот же вектор, а не просто пропорциональный), то соответствующие точки коллинеарны.</p>
            <p>Пример: <span class="formula">AB = 3a + 2b</span>, <span class="formula">BC = a + 5b</span>, <span class="formula">CD = 2a − 3b</span>. Складываем два «соседних» вектора: <span class="formula">BD = BC + CD = (a+5b) + (2a−3b) = 3a + 2b</span>. Замечаем, что <span class="formula">BD = AB</span> — это тот же самый вектор. Значит A, B, D лежат на одной прямой (причём B — середина отрезка AD).</p>
          </div>

          <div class="card">
            <h3><span class="num">6.6b</span>Коллинеарность через координаты</h3>
            <p>Если векторы заданы конкретными числовыми координатами (не через абстрактный базис, как выше), для коллинеарности достаточно проверить <b>пропорциональность</b> координат: векторы <span class="formula">a=(a₁;a₂)</span> и <span class="formula">b=(b₁;b₂)</span> коллинеарны тогда и только тогда, когда <span class="formula">a₁b₂ = a₂b₁</span> (то есть a₁/b₁ = a₂/b₂ при b₁,b₂≠0).</p>
            <p>Пример: при каком значении k векторы a=(3;k) и b=(6;10) коллинеарны? Составляем пропорцию: <span class="formula">3/6 = k/10</span> → <span class="formula">k = 10·(3/6) = 5</span>.</p>
          </div>

            <p>Точка M делит отрезок AB в отношении <span class="formula">AM : MB = m : n</span>, если её координаты находятся по формуле:</p>
            <p><span class="formula">x_M = (n·x_A + m·x_B) / (m + n)</span>, &nbsp; <span class="formula">y_M = (n·y_A + m·y_B) / (m + n)</span></p>
            <p>Пример: A(2;5), B(11;−4), точка M делит AB в отношении AM:MB = 2:1. Здесь m=2, n=1: <span class="formula">x_M = (1·2 + 2·11)/3 = 24/3 = 8</span>, <span class="formula">y_M = (1·5 + 2·(−4))/3 = −3/3 = −1</span>. Ответ: M(8; −1).</p>
          </div>
        `,

            <p>Порядок действий всегда один и тот же: 1) выписать координаты центра (a; b); 2) выписать радиус r; 3) подставить оба значения в стандартную формулу и возвести r в квадрат.</p>

          <div class="card">
            <h3><span class="num">7.2</span>Каноническое уравнение</h3>
            <p><span class="formula">y² = 2px</span> (p &gt; 0) — ветви направлены вправо, фокус в точке (p/2; 0), директриса x = −p/2.</p>

          <div class="card">

            <p>Помимо канонической формы y²=2px (ветви вбок), на экзамене встречается и привычная со школы форма <span class="formula">y = ax²</span> (ветви вверх при a&gt;0 или вниз при a&lt;0) — это тоже парабола, просто повёрнутая на 90°. Её <b>вершина</b> (точка минимума/максимума) для базовой формы y=ax² находится в начале координат (0; 0).</p>

            <p>Парабола — это множество всех точек P, равноудалённых от фокуса F и директрисы: <span class="formula">|PF| = d(P, директриса)</span>. Именно из этого равенства выводится каноническое уравнение, и его же используют в задачах, где явно спрашивают про расстояние от точки параболы до фокуса.</p>

            <h3><span class="num">7.6</span>Формула и значения</h3>
            <p><span class="formula">e = c/a</span></p>
            <p>Для эллипса: 0 &lt; e &lt; 1 (чем ближе к 0, тем ближе форма к окружности). Для параболы: e = 1. Для гиперболы: e &gt; 1.</p>
            <p>Чтобы найти e для эллипса или гиперболы по уравнению x²/a² ± y²/b² = 1, сначала находят c: для эллипса <span class="formula">c = √(a² − b²)</span>, для гиперболы <span class="formula">c = √(a² + b²)</span>, а затем делят на a.</p>
            <p>Частный случай: у окружности a = b, значит c = √(a²−a²) = 0, и <span class="formula">e = 0/a = 0</span> — окружность можно считать «эллипсом с нулевым эксцентриситетом».</p>
          </div>
          <div class="card">
            <h3><span class="num">7.6b</span>Эллипс и гипербола рядом: где легко перепутать</h3>
            <p>Оба уравнения выглядят почти одинаково — x²/a² + y²/b² = 1 у эллипса и x²/a² − y²/b² = 1 у гиперболы — поэтому именно знак между дробями и стоит проверять в первую очередь, прежде чем считать что-либо ещё.</p>
            <p>У эллипса c находится по формуле c = √(a² − b²), а сам эллипс — замкнутая ограниченная кривая, эксцентриситет всегда лежит в диапазоне 0 &lt; e &lt; 1, и чем ближе e к нулю, тем эллипс круглее; асимптот у эллипса нет вовсе.</p>
            <p>У гиперболы, наоборот, c находится по формуле c = √(a² + b²) — то есть c у гиперболы всегда больше a, — кривая состоит из двух бесконечных ветвей, эксцентриситет всегда больше 1 (e &gt; 1), и чем ближе e к единице, тем гипербола «уже» и ближе к параболе; и именно у гиперболы (в отличие от эллипса) есть две асимптоты y = ±(b/a)x, к которым ветви приближаются на бесконечности.</p>
            <p>Простое правило запоминания: минус между дробями и плюс под корнем при вычислении c — это гипербола; плюс между дробями и минус под корнем при вычислении c — это эллипс.</p>
          </div>

        id: 'seq-misc',
        title: 'Разные последовательности',
        theoryHTML: `
          <p class="lead">Отдельный случай — сумма бесконечно убывающей геометрической прогрессии, когда |r| &lt; 1.</p>
          <div class="card">
            <h3><span class="num">8.3b</span>Напоминание: как распознать AP и GP</h3>
            <p><b>Арифметическая (AP):</b> разность между соседними членами постоянна: <span class="formula">aₙ₊₁ − aₙ = d</span> (одно и то же число).</p>
            <p><b>Геометрическая (GP):</b> отношение соседних членов постоянно: <span class="formula">aₙ₊₁ / aₙ = r</span> (одно и то же число).</p>
          </div>
          <div class="card">
            <h3><span class="num">8.4</span>Сумма бесконечной прогрессии</h3>
            <p><span class="formula">S = a₁ / (1 − r)</span>, при |r| &lt; 1</p>
          </div>

          <div class="card">
            <h3><span class="num">8.5</span>Рекуррентные последовательности</h3>
            <p>Иногда последовательность задана не формулой общего члена, а <b>рекуррентно</b> — каждый следующий член выражен через предыдущий. Напрямую вычислять до a₁₀₀ или a₂₀₂₅ долго, поэтому ищут замену переменной, которая превращает рекурренту в обычную арифметическую или геометрическую прогрессию.</p>
            <p>Пример: <span class="formula">a₁ = 1/2</span>, <span class="formula">aₙ = 1 / (1 + 1/aₙ₋₁)</span> при n ≥ 2. Найти a₄₉.</p>
            <p>Вводим <span class="formula">bₙ = 1/aₙ</span>. Тогда из формулы: <span class="formula">bₙ = 1 + 1/aₙ₋₁ = 1 + bₙ₋₁</span> — это арифметическая прогрессия с разностью d = 1 и первым членом b₁ = 1/a₁ = 2. Значит <span class="formula">bₙ = n + 1</span>, откуда <span class="formula">aₙ = 1/(n + 1)</span>.</p>
            <p>Ответ: <span class="formula">a₄₉ = 1/50</span>.</p>
            <p>Общий приём: если в рекурренте встречается 1/aₙ₋₁, пробуй заменить bₙ = 1/aₙ; если встречается aₙ² или √aₙ, пробуй bₙ = aₙ² и т.п. — цель превратить рекурренту в линейную (арифметическую) зависимость bₙ = bₙ₋₁ + d.</p>
          </div>

          <div class="card">
            <h3><span class="num">8.6</span>Знакочередующаяся геометрическая прогрессия и сумма модулей</h3>
            <p>Рекуррента не всегда «прячет» арифметическую прогрессию — иногда после упрощения сразу получается геометрическая, просто со знакопеременным (отрицательным) знаменателем.</p>
            <p>Пример: <span class="formula">a₁ = 1</span>, <span class="formula">1/aₙ + 3/aₙ₊₁ = 0</span>. Выражаем: <span class="formula">3/aₙ₊₁ = −1/aₙ</span> → <span class="formula">aₙ₊₁ = −3aₙ</span> — это геометрическая прогрессия со знаменателем <b>r = −3</b> (без всякой замены переменной). Члены чередуют знак: 1, −3, 9, −27, ...</p>
            <p>Если далее спрашивают про <span class="formula">bₙ = |aₙ|</span>, знаки уходят, и bₙ = 3ⁿ⁻¹ — уже обычная геометрическая прогрессия с положительным знаменателем 3. Тогда сумма первых n членов по стандартной формуле:</p>

          </div>

          <div class="card">
            <h3><span class="num">8.7</span>Метод группировки: сумма «GP минус AP»</h3>
            <p>Если общий член представляет собой <b>разность (или сумму) геометрической и арифметической частей</b>, его нельзя просуммировать одной формулой целиком — нужно разбить сумму на две части и просуммировать каждую своей формулой отдельно.</p>
            <p>Пример: <span class="formula">aₙ = 3ⁿ − 2n</span>. Найти Sₙ = a₁ + a₂ + ... + aₙ.</p>
            <p>Разбиваем на две суммы: <span class="formula">Sₙ = Σ3ᵏ − Σ2k</span> (обе суммы от k=1 до n).</p>
            <p>Первая — геометрическая прогрессия (3¹ + 3² + ... + 3ⁿ, первый член 3, знаменатель 3): <span class="formula">Σ3ᵏ = 3(3ⁿ−1)/(3−1) = (3ⁿ⁺¹ − 3)/2</span></p>
            <p>Вторая — арифметическая (2+4+...+2n): <span class="formula">Σ2k = n(n+1)</span></p>
            <p>Итог: <span class="formula">Sₙ = (3ⁿ⁺¹ − 3)/2 − n(n+1)</span></p>
          </div>

          <div class="card">
            <h3><span class="num">8.8</span>От Sₙ к aₙ: приём вычитания соседних сумм</h3>
            <p>Если задана связь между <b>суммой первых n членов Sₙ</b> и самим членом aₙ (а не прямая рекуррентная формула для aₙ), стандартный приём — записать то же соотношение для n−1, вычесть одно из другого и воспользоваться тождеством <span class="formula">Sₙ − Sₙ₋₁ = aₙ</span> (работает при n ≥ 2). Случай n = 1 (где Sₙ₋₁ не существует) разбирается отдельно: там просто <span class="formula">S₁ = a₁</span>.</p>
            <p>Пример: <span class="formula">Sₙ = (3/4)aₙ + 1/4</span> для всех n ≥ 1. Найти общую формулу aₙ.</p>
            <p><b>Шаг 1 (n=1):</b> S₁ = a₁, значит <span class="formula">a₁ = (3/4)a₁ + 1/4</span> → <span class="formula">a₁ = 1</span>.</p>
            <p><b>Шаг 2 (n≥2):</b> вычитаем Sₙ₋₁ = (3/4)aₙ₋₁ + 1/4 из Sₙ = (3/4)aₙ + 1/4: <span class="formula">Sₙ − Sₙ₋₁ = (3/4)(aₙ − aₙ₋₁)</span>. Но левая часть по тождеству равна aₙ, поэтому: <span class="formula">aₙ = (3/4)aₙ − (3/4)aₙ₋₁</span> → <span class="formula">(1/4)aₙ = −(3/4)aₙ₋₁</span> → <span class="formula">aₙ = −3aₙ₋₁</span>.</p>
            <p>Получили геометрическую прогрессию со знаменателем −3 и a₁ = 1, значит <span class="formula">aₙ = (−3)ⁿ⁻¹</span>.</p>

            <p>Если числа заданы в тригонометрической форме, умножать даже проще: <b>модули перемножаются</b>, а <b>аргументы складываются</b>: <span class="formula">|z₁·z₂| = |z₁|·|z₂|</span>, arg(z₁·z₂) = arg(z₁) + arg(z₂). Например, при умножении чисел с модулями 2 и 3 модуль произведения равен 2·3 = 6, независимо от аргументов.</p>
          </div>
          <div class="card">
            <h3><span class="num">10.5</span>Сопряжённое число</h3>
            <p>Для z = a+bi сопряжённым является <span class="formula">z̄ = a − bi</span>. Произведение <span class="formula">z · z̄ = a² + b² = |z|²</span> — всегда действительное число.</p>
          </div>

          <div class="card">
            <h3><span class="num">10.6</span>Комплексный корень квадратного уравнения с действительными коэффициентами</h3>
            <p>Если у квадратного уравнения <span class="formula">x² + px + q = 0</span> все коэффициенты <b>действительные</b>, а один из корней — нереальное комплексное число z, то второй корень обязательно равен <b>сопряжённому z̄</b>. Это позволяет применить теорему Виета, даже не решая уравнение обычным способом:</p>

        id: 'prob-problems',
        title: 'Задачи на вероятность',
        theoryHTML: `
          <p class="lead">Комбинируя простые события, можно находить вероятность более сложных ситуаций.</p>
          <div class="card">
            <h3><span class="num">11.1</span>Главная формула вероятности</h3>
            <p>Вероятность — это доля нужных нам исходов от всех возможных: <span class="formula">P = (сколько исходов подходит) / (сколько всего исходов)</span></p>
            <p>Пример: в коробке 5 шаров (3 красных и 2 синих). Вероятность достать красный: <span class="formula">3/5 = 0.6</span></p>
            <p><b>Метод исключения:</b> если в вопросе встречается «хотя бы один...» или «хотя бы два...», считать напрямую долго. Проще найти вероятность «плохого» (ненужного) исхода и вычесть её из 1: <span class="formula">P(нужное) = 1 − P(ненужное)</span></p>
          </div>

          <div class="card">
            <h3><span class="num">11.2</span>Противоположное и независимые события</h3>
            <p>Противоположное событие: <span class="formula">P(не A) = 1 − P(A)</span></p>
            <p>Для независимых событий (оба происходят вместе — союз «И»): <span class="formula">P(A и B) = P(A) · P(B)</span></p>
            <p>Пример: первый студент выбирает App A с вероятностью 0.4, второй — независимо от него — с вероятностью 0.3. Вероятность, что оба выберут App A: <span class="formula">0.4 · 0.3 = 0.12</span></p>
          </div>

          <div class="card">
            <h3><span class="num">11.3</span>Союз «ИЛИ»: вероятности складываются</h3>
            <p>Если подходит либо один исход, либо другой, но не оба сразу (события несовместны), их вероятности просто складываются: <span class="formula">P(A или B) = P(A) + P(B)</span></p>
            <p>Пример: вероятность достать из коробки красный ИЛИ жёлтый шар равна P(красный) + P(жёлтый).</p>
          </div>

          <div class="card">
            <h3><span class="num">11.4</span>Правило умножения и сочетания C(n,m)</h3>
            <p><b>Правило умножения:</b> если нужно выбрать один предмет из первой группы (X способов) И один из второй (Y способов), общее число комбинаций — <span class="formula">X · Y</span></p>
            <p>Пример: 3 нечётные цифры и 4 чётные — способов составить пару (нечётная + чётная): <span class="formula">3 · 4 = 12</span></p>
            <p><b>Сочетания C(n,m):</b> используются, когда несколько предметов достают <b>одновременно, без учёта порядка</b> (переставили местами в руке — суть не изменилась): <span class="formula">C(n,m) = n! / (m!·(n−m)!)</span></p>
            <p>Считать удобно так: в числителе — убывающий ряд из n, множителей ровно m штук; в знаменателе — ряд от 1 до m.</p>
            <p><span class="formula">C(5,2) = (5×4)/(2×1) = 10</span>&nbsp;&nbsp;<span class="formula">C(6,3) = (6×5×4)/(3×2×1) = 20</span>&nbsp;&nbsp;<span class="formula">C(8,2) = (8×7)/(2×1) = 28</span></p>
          </div>

          <div class="card">
            <h3><span class="num">11.5</span>«Хотя бы» и «совпадения» (задачи типа дня рождения)</h3>
            <p>Когда в вопросе встречается формулировка «хотя бы один/два...» или «у скольких-то совпадает какой-то признак», почти всегда быстрее считать через <b>противоположное событие</b>: вместо «хотя бы 2 совпали» ищем P(все разные), а затем вычитаем из 1.</p>
            <p>Пример: в году 12 месяцев. Случайно выбрали 4 человек. Какова вероятность, что хотя бы у двоих совпадёт месяц рождения?</p>
            <p>Считаем вероятность обратного события — что у всех четверых месяцы <b>разные</b>. Первому человеку подходит любой из 12 месяцев (вероятность 12/12), второму — любой, кроме уже занятого (11/12), третьему — любой из оставшихся (10/12), четвёртому — (9/12):</p>
            <p><span class="formula">P(все разные) = (12/12) · (11/12) · (10/12) · (9/12) = 11880/20736 = 55/96</span></p>
            <p><span class="formula">P(хотя бы двое совпали) = 1 − 55/96 = 41/96</span></p>
          </div>

          <div class="card">
            <h3><span class="num">11.6</span>Задачи с двумя независимыми группами и таблицами</h3>
            <p>В задачах, где даны две группы (например, пользователи Android и iOS) с таблицей предпочтений и просят найти вероятность, что два случайно выбранных человека (по одному из каждой группы) выберут <b>разное</b>, короче всего идти через метод исключения:</p>
            <p>1. Посчитайте вероятность того, что они выберут <b>одинаковое</b>: (P(X)·P(X)) + (P(Y)·P(Y)) + (P(Z)·P(Z)) — то есть сложите вероятности совпадения по каждому варианту, используя правило умножения «И» для каждого слагаемого.</p>
            <p>2. Вычтите сумму из 1: <span class="formula">P(разное) = 1 − P(одинаковое)</span> — это гораздо быстрее, чем перебирать все варианты «разных» пар напрямую.</p>
          </div>

          <div class="card">
            <h3><span class="num">11.7</span>Вероятность через систему уравнений</h3>
            <p>Иногда задача не даёт готовых чисел напрямую, а описывает несколько вероятностных условий словами — тогда сначала нужно перевести их в <b>систему линейных уравнений</b> относительно количеств (не вероятностей!), решить её, и только потом посчитать нужные вероятности.</p>
            <p>Пример: в непрозрачном мешке 16 шаров четырёх цветов — красные, жёлтые, синие, зелёные. P(красный) = 1/4. P(жёлтый или зелёный) = 7/16. P(синий или жёлтый) = 7/16. Сколько шаров каждого цвета?</p>
            <p>Переводим вероятности в количества (всего 16 шаров): <span class="formula">красных = 16 · 1/4 = 4</span>, <span class="formula">жёлтых + зелёных = 16 · 7/16 = 7</span>, <span class="formula">синих + жёлтых = 7</span>.</p>
            <p>Остаток после красных: <span class="formula">синих + жёлтых + зелёных = 16 − 4 = 12</span>. Так как жёлтых+зелёных = 7, то <span class="formula">синих = 12 − 7 = 5</span>. Из синих+жёлтых=7 получаем <span class="formula">жёлтых = 7 − 5 = 2</span>, тогда <span class="formula">зелёных = 7 − 2 = 5</span>.</p>
            <p>Итоговые вероятности: P(жёлтый) = 2/16 = 1/8, P(синий) = 5/16, P(зелёный) = 5/16.</p>
          </div>

          <div class="card">
            <h3><span class="num">11.8</span>Вероятность через перестановки и законы чередования</h3>
            <p>Если объекты <b>различимы между собой</b> (у каждого шара/человека свой номер или имя, а не просто «цвет»), а вопрос — про порядок, в котором их достают, нужно считать не сочетания, а <b>перестановки</b>: число упорядоченных способов выбрать k объектов из n различимых — <span class="formula">P(n,k) = n! / (n−k)!</span></p>
            <p>Пример: есть n различимых белых и n различимых красных шаров (2n шаров всего). Вынимают по одному <b>все 2n шаров</b> по порядку без возвращения. Найти вероятность P(n), что цвета в вытянутой последовательности строго чередуются (Б,К,Б,К,... или К,Б,К,Б,...), и сравнить P(2), P(3), P(4).</p>
            <p>Всего способов вытянуть все 2n шаров по порядку: <span class="formula">(2n)!</span></p>
            <p>Благоприятные исходы: в чередующемся узоре ровно n «белых» позиций и n «красных». На белые позиции нужно упорядоченно расставить все n белых шаров — это <span class="formula">n!</span> способов, аналогично для красных — тоже <span class="formula">n!</span> способов. Узора 2 (начать с белого или с красного). Итого благоприятных: <span class="formula">2·(n!)²</span></p>
            <p><span class="formula">P(n) = 2·(n!)² / (2n)!</span></p>
            <p>Считаем: P(2) = 2·(2!)²/4! = 8/24 = 1/3. P(3) = 2·(3!)²/6! = 72/720 = 1/10. P(4) = 2·(4!)²/8! = 1152/40320 = 1/35. Число всех раскладов (2n)! растёт намного быстрее, чем 2·(n!)², поэтому вероятность строгого чередования быстро падает с ростом n: <span class="formula">P(2) &gt; P(3) &gt; P(4)</span>.</p>
            <p>Общее правило чередования: с ростом числа предметов удержать идеальный «шахматный» порядок без единой ошибки становится всё труднее, поэтому P(n) стремительно падает, и при <span class="formula">n → ∞</span> вероятность стремится к <span class="formula">0</span>.</p>
          </div>
        `,
        terms: [

          {ru:'Противоположное событие', en:'Complementary event', ex:'Событие, состоящее в ненаступлении исходного: P(не A) = 1 − P(A). Основа «метода исключения» для задач «хотя бы».'},

        questions: [
          { q:'В мешке 6 шаров: три синих (с номерами 1, 2 и 3), два жёлтых (с номерами 1 и 2) и один зелёный (с номером 1). Наугад без возвращения вынимают два шара. Найдите вероятность того, что шары окажутся разных цветов, и вероятность того, что хотя бы на одном из них номер 1 (соответственно).', options:['11/15, 4/5', '4/5, 4/5', '11/15, 2/3', '4/5, 14/15'], correct:0,
            explain:'Всего способов выбрать 2 шара из 6: C(6,2) = (6×5)/(2×1) = 15. Одинаковый цвет получится, если оба шара синие (C(3,2)=3 способа) или оба жёлтые (C(2,2)=1 способ) — всего 4 исхода, значит разных цветов 15−4=11 исходов, P₁=11/15. Шаров с номером 1 три: С1, Ж1, З1; без номера 1 — тоже три: С2, С3, Ж2. Пар вообще без единицы: C(3,2)=3, значит пар хотя бы с одной единицей: 15−3=12, P₂=12/15=4/5.',
            en:{q:"A bag contains six identical balls: three blue balls (labeled 1, 2, and 3), two yellow balls (labeled 1 and 2), and one green ball (labeled 1). Two balls are drawn randomly without replacement. Find the probability that the balls have different colors, and the probability that at least one ball is labeled 1, respectively.", options:["11/15, 4/5","4/5, 4/5","11/15, 2/3","4/5, 14/15"]},

            explain:'Всего способов выбрать 2 карточки из 5: C(5,2)=10. Один цвет: пара красных (1 способ) или пара зелёных (1 способ) — итого 2 исхода, P₁=2/10=1/5. Карточек без буквы B три: К(A), З(A), С(A); способов выбрать 2 из них C(3,2)=3, значит P₂=3/10.',
            en:{q:"A box contains 5 cards: two red cards (labeled A and B), two green cards (labeled A and B), and one blue card (labeled A). Two cards are drawn randomly without replacement. What is the probability that both cards are of the same color, and the probability that neither card is labeled B, respectively?", options:["1/5, 3/10","2/5, 3/10","1/5, 1/2","2/5, 1/2"]},
            zh:{q:"盒中有5张卡片：两张红色卡片（标记A和B）、两张绿色卡片（标记A和B）和一张蓝色卡片（标记A）。无放回地随机取出两张卡片。分别求两张卡片颜色相同的概率，以及两张卡片都不标记为B的概率。", options:["1/5, 3/10","2/5, 3/10","1/5, 1/2","2/5, 1/2"]}},
          { q:'В ящике 6 носков: два чёрных (размеры S и L), два белых (размеры S и L) и два серых (размеры S и L). Наугад без возвращения вынимают два носка. Какова вероятность того, что они разных цветов и оба размера L?', options:['1/5', '4/15', '1/15', '2/5'], correct:0,
            explain:'Всего способов выбрать 2 носка из 6: C(6,2)=15. Носков размера L всего три: чёрный L, белый L, серый L — и они уже все разных цветов, поэтому подойдёт любая пара из этих трёх: C(3,2)=3. P = 3/15 = 1/5.',
            en:{q:"In a drawer, there are 6 socks: two black socks (sizes Small and Large), two white socks (sizes Small and Large), and two grey socks (sizes Small and Large). If two socks are selected at random without replacement, what is the probability that they are of different colors and both are of size Large?", options:["1/5","4/15","1/15","2/5"]},

          { q:'Опросили 100 пользователей Android и 100 пользователей iOS про любимое приложение для музыки (App X, App Y, App Z), результаты — в таблице ниже. Если выбрать по одному пользователю из каждой группы независимо, какова вероятность, что они предпочитают разные приложения?<br><br>Android: App X — 50, App Y — 30, App Z — 20<br>iOS: App X — 20, App Y — 40, App Z — 40', options:['7/10', '3/10', '16/25', '9/25'], correct:0,

const lockedModules = [];
const lockedGroups = [];
const lockedModulesAfterGroups = [];

// Module share of the real CSCA exam: cluster-level percentages come from public
// syllabus/past-paper weighting research (Functions incl. trig/sequences/logs ~48%,
// Geometry/Algebra incl. analytic geometry/conics/complex numbers ~40%,
// Sets & Inequalities ~10%, Probability ~2%); split within each cluster
// proportionally to our own bank's current question counts per module.
const moduleWeights = {
  'analytic-geometry': 21,
  'trig': 18,
  'functions': 16,
  'conics': 13,
  'sequences': 7,
  'exp-log': 7,
  'inequalities': 6,
  'complex-numbers': 6,
  'sets': 4,
  'probability': 2,
};
modules.sort((a, b) => (moduleWeights[b.id] || 0) - (moduleWeights[a.id] || 0));

// ============ SIDEBAR RENDER ============
const treeArea = document.getElementById('treeArea');
const lockedArea = document.getElementById('lockedArea');

modules.forEach((mod, idx)=>{
  const wrap = document.createElement('div');
  wrap.className = 'tree-module';
  wrap.dataset.module = mod.id;
  const lessonsHTML = mod.lessons.map(lesson => `
    <div class="tree-item" data-module="${mod.id}" data-lesson="${lesson.id}"><span class="dot"></span>${lesson.title}</div>
  `).join('');
  wrap.innerHTML = `
    <div class="tree-module-head">
      <span class="idx">${idx+1}</span>
      <span class="head-title">${mod.title}</span>
      ${moduleWeights[mod.id] ? `<span class="weight-badge">${moduleWeights[mod.id]}%</span>` : ''}
      <span class="chevron">▾</span>
    </div>
    <div class="module-progress" data-progress-for="${mod.id}">
      <div class="module-progress-bar"><div class="module-progress-fill" style="width:0%"></div></div>
      <span class="module-progress-text">0/${mod.lessons.length}</span>
    </div>
    <div class="tree-children">${lessonsHTML}</div>
  `;
  treeArea.appendChild(wrap);
});

let runningIdx = modules.length;

lockedModules.forEach((name)=>{
  runningIdx++;
  const wrap = document.createElement('div');
  wrap.className = 'tree-module locked';
  wrap.innerHTML = `
    <div class="tree-module-head">
      <span class="idx">${runningIdx}</span>
      <span>${name}</span>
      <span class="lock">🔒</span>
    </div>
  `;
  lockedArea.appendChild(wrap);
});

lockedGroups.forEach((group)=>{
  runningIdx++;
  const wrap = document.createElement('div');
  wrap.className = 'tree-module group';
  const childrenHTML = group.children.map(name => `
    <div class="tree-item locked-item"><span class="dot"></span>${name}<span class="lock-mini">🔒</span></div>
  `).join('');
  wrap.innerHTML = `
    <div class="tree-module-head">
      <span class="idx">${runningIdx}</span>
      <span class="head-title">${group.title}</span>
      <span class="chevron">▾</span>
    </div>
    <div class="tree-children">${childrenHTML}</div>
  `;
  lockedArea.appendChild(wrap);
});

lockedModulesAfterGroups.forEach((name)=>{
  runningIdx++;
  const wrap = document.createElement('div');
  wrap.className = 'tree-module locked';
  wrap.innerHTML = `
    <div class="tree-module-head">
      <span class="idx">${runningIdx}</span>
      <span>${name}</span>
      <span class="lock">🔒</span>
    </div>
  `;
  lockedArea.appendChild(wrap);
});

// ============ SIDEBAR ACCORDION (collapse module lists so the sidebar isn't one long scroll) ============
function collapseAllTreeModules(except){
  document.querySelectorAll('.tree-module.expanded').forEach(m=>{
    if(m !== except) m.classList.remove('expanded');
  });
}
function expandTreeModule(moduleId){
  const el = document.querySelector(`.tree-module[data-module="${moduleId}"]`);
  if(!el) return;
  collapseAllTreeModules(el);
  el.classList.add('expanded');
}
document.querySelectorAll('.tree-module').forEach(mod=>{
  const head = mod.querySelector('.tree-module-head');
  const children = mod.querySelector('.tree-children');
  if(!head || !children) return; // locked entries with no list — nothing to expand
  head.addEventListener('click', ()=>{
    const willOpen = !mod.classList.contains('expanded');
    collapseAllTreeModules();
    if(willOpen) mod.classList.add('expanded');
  });
});

// ============ STREAK (consecutive study days) ============
function todayStr(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function pluralDays(n){
  const n10 = n % 10, n100 = n % 100;
  if(n100 >= 11 && n100 <= 14) return 'дней';
  if(n10 === 1) return 'день';
  if(n10 >= 2 && n10 <= 4) return 'дня';
  return 'дней';
}
function loadStreak(){
  try{ return JSON.parse(localStorage.getItem('csca_streak')) || {last:null, count:0}; }catch(e){ return {last:null, count:0}; }
}
function saveStreak(s){
  try{ localStorage.setItem('csca_streak', JSON.stringify(s)); }catch(e){}
}
function touchStreak(){
  const s = loadStreak();
  const today = todayStr();
  if(s.last === today) return s; // activity already counted today
  if(s.last){
    const diffDays = Math.round((new Date(today) - new Date(s.last)) / 86400000);
    s.count = (diffDays === 1) ? s.count + 1 : 1;
  } else {
    s.count = 1;
  }
  s.last = today;
  saveStreak(s);
  return s;
}
function refreshStreakUI(){
  const el = document.getElementById('streakStat');
  if(!el) return;
  const s = loadStreak();
  el.textContent = s.count > 0 ? `🔥 ${s.count} ${pluralDays(s.count)} подряд` : '🔥 начни серию';
}

function isLessonDone(lesson){
  const st = practiceState[lesson.id];
  return !!(st && st.current >= lesson.questions.length);
}
function computeModuleProgress(mod){
  const total = mod.lessons.length;
  const done = mod.lessons.filter(isLessonDone).length;
  return { done, total };
}
function computeOverallProgress(){
  let done = 0, total = 0;
  modules.forEach(mod=>{
    const p = computeModuleProgress(mod);
    done += p.done; total += p.total;
  });
  return { done, total };
}

  const pctEl = document.getElementById('statusPct');

}

// viewIndex: которую карточку сейчас показываем (можно листать назад/вперёд
// стрелками или кликом по полоске прогресса — не обязательно совпадает с
// state.current, который отмечает "докуда дошли" в самом опросе).
function renderProgress(lesson, viewIndex){
  const state = practiceState[lesson.id];
  const progressEl = document.getElementById('progress');
  if(!progressEl) return;
  progressEl.innerHTML = '';
  lesson.questions.forEach((_, i)=>{
    const seg = document.createElement('div');
    let cls = 'seg';
    const status = state.statuses && state.statuses[i];
    if(status === 'correct') cls += ' correct';
    else if(status === 'wrong') cls += ' wrong';
    else if(status === 'skipped') cls += ' skipped';
    else if(i === state.current) cls += ' current';
    else cls += ' upcoming';
    if(i === viewIndex) cls += ' viewing';
    seg.className = cls;
    if(i <= state.current) seg.addEventListener('click', ()=> renderQuestion(lesson, i));
    progressEl.appendChild(seg);
  });
}

// Свайп по карточке вопроса — та же функция, что кнопка "Пропустить"/"Дальше",
// в зависимости от того, отвечено уже на вопрос или нет.
function attachSwipe(card, onSwipe){
  let startX = 0, startY = 0, tracking = false;
  card.addEventListener('touchstart', (e)=>{
    if(e.touches.length !== 1) return;
    startX = e.touches[0].clientX; startY = e.touches[0].clientY; tracking = true;
  }, {passive:true});
  card.addEventListener('touchmove', (e)=>{
    if(!tracking || e.touches.length !== 1) return;
    const dx = e.touches[0].clientX - startX;
    const dy = e.touches[0].clientY - startY;
    if(Math.abs(dx) > Math.abs(dy)){
      card.classList.add('swiping');
      card.style.transform = `translateX(${dx}px)`;
      card.style.opacity = String(Math.max(0.4, 1 - Math.abs(dx)/300));
    }
  }, {passive:true});
  const reset = ()=>{ card.classList.remove('swiping'); card.style.transform = ''; card.style.opacity = ''; };
  card.addEventListener('touchend', (e)=>{
    if(!tracking) return;
    tracking = false;
    const touch = e.changedTouches[0];
    const dx = touch.clientX - startX;
    const dy = touch.clientY - startY;
    reset();
    if(Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.5){
      onSwipe();
    }
  }, {passive:true});
  card.addEventListener('touchcancel', reset, {passive:true});
}

function questionStemHTML(item){
  const zh = item.zh && item.zh.q ? item.zh.q : '';
  const en = item.en && item.en.q ? item.en.q : '';
  if(!zh && !en) return `<div class="q-text">${item.q}</div>`;
  return `
    <div class="q-text-block">
      ${zh ? `<div class="q-text-zh">${zh}</div>` : ''}
      ${en ? `<div class="q-text-en">${en}</div>` : ''}
      <div class="q-text-ru">${item.q}</div>
    </div>
  `;
}

function optionInnerHTML(item, i){
  const ru = item.options[i];
  const en = item.en && item.en.options ? item.en.options[i] : ru;
  const zh = item.zh && item.zh.options ? item.zh.options[i] : ru;
  if(en === ru && zh === ru){
    return `<span>${ru}</span>`;
  }
  return `<span class="opt-multi">${zh && zh!==en ? `<span class="opt-zh">${zh}</span>` : ''}<span class="opt-en">${en}</span><span class="opt-ru">${ru}</span></span>`;
}

function renderQuestion(lesson, viewIndex){
  const state = practiceState[lesson.id];
  if(viewIndex === undefined) viewIndex = state.current;
  const total = lesson.questions.length;
  if(viewIndex >= total){ renderDone(lesson); return; }
  renderProgress(lesson, viewIndex);
  if(!state.shuffled) state.shuffled = {};
  if(!state.shuffled[viewIndex]) state.shuffled[viewIndex] = shuffleOptions(lesson.questions[viewIndex]);
  const item = state.shuffled[viewIndex];
  const status = state.statuses ? state.statuses[viewIndex] : undefined; // 'correct' | 'wrong' | 'skipped' | undefined
  const isReview = status !== undefined; // уже отвечен/пропущен — показываем как прочитанную карточку
  const finished = state.current >= total; // весь урок пройден, можно листать без ограничений
  const isLast = viewIndex === total - 1;
  const quizArea = document.getElementById('quizArea');

  const bannerLabel = status === 'correct' ? '✓ Отвечено верно' : status === 'wrong' ? '✕ Отвечено неверно' : status === 'skipped' ? '— Пропущено' : '';
  const bannerHTML = status ? `<div class="review-banner ${status}">${bannerLabel}</div>` : '';

  const prevDisabled = viewIndex === 0;
  const nextDisabled = finished ? false : viewIndex >= state.current;

  quizArea.innerHTML = `
    <div class="q-card">
      <div class="q-nav-row">
        <button class="q-nav-arrow" id="qPrevArrow" ${prevDisabled ? 'disabled' : ''} aria-label="Предыдущий вопрос">←</button>
        <div class="q-eyebrow">Вопрос ${viewIndex+1} из ${total}</div>
        <button class="q-nav-arrow" id="qNextArrow" ${nextDisabled ? 'disabled' : ''} aria-label="Следующий вопрос">→</button>
      </div>
      ${bannerHTML}
      ${questionStemHTML(item)}
      <div class="options" id="optsWrap"></div>
      <div class="explain${isReview ? ' show' : ''}" id="explainBox"><div class="tag">Объяснение</div><p>${item.explain}</p></div>
      <button class="next-btn" id="nextBtn">${isLast ? 'Завершить' : 'Следующий вопрос →'}</button>
      <div class="skip-row" id="skipRow">
        <button class="skip-btn" id="skipBtn">Не знаю, пропустить →</button>
        <div class="skip-hint">Или смахни карточку в сторону</div>
      </div>
    </div>
  `;
  const optsWrap = document.getElementById('optsWrap');
  const letters = ['A','B','C','D'];
  item.options.forEach((opt, i)=>{
    const o = document.createElement('div');
    o.className = 'opt';
    o.innerHTML = `<span class="letter">${letters[i]}</span>${optionInnerHTML(item, i)}`;
    if(!isReview) o.addEventListener('click', ()=> selectAnswer(lesson, viewIndex, i));
    optsWrap.appendChild(o);
  });

  if(isReview){
    optsWrap.classList.add('answered', 'disabled');
    const opts = optsWrap.querySelectorAll('.opt');
    opts.forEach(o=> o.classList.add('disabled'));
    if(status === 'correct' || status === 'wrong') opts[item.correct].classList.add('correct');
    if(status === 'wrong' && state.picks && state.picks[viewIndex] !== undefined) opts[state.picks[viewIndex]].classList.add('wrong');
    document.getElementById('nextBtn').style.display = 'none';
    document.getElementById('skipRow').style.display = 'none';
  } else {
    document.getElementById('skipBtn').addEventListener('click', ()=> skipQuestion(lesson));
    document.getElementById('nextBtn').addEventListener('click', ()=> goNext(lesson), {once:true});
  }

  document.getElementById('qPrevArrow').addEventListener('click', ()=>{
    if(viewIndex > 0) renderQuestion(lesson, viewIndex - 1);
  });
  document.getElementById('qNextArrow').addEventListener('click', ()=>{
    if(finished && viewIndex === total - 1){ renderDone(lesson); return; }
    if(viewIndex < state.current || finished){ renderQuestion(lesson, viewIndex + 1); }
  });

  const card = quizArea.querySelector('.q-card');
  attachSwipe(card, ()=>{
    if(isReview){
      if(finished && viewIndex === total - 1){ renderDone(lesson); return; }
      if(viewIndex < state.current || finished){ renderQuestion(lesson, viewIndex + 1); }
    } else {
      const answered = optsWrap.classList.contains('answered');
      if(answered){ goNext(lesson); } else { skipQuestion(lesson); }
    }
  });
}

function goNext(lesson){
  const state = practiceState[lesson.id];
  state.current++;
  renderQuestion(lesson, state.current);
}

function skipQuestion(lesson){
  const state = practiceState[lesson.id];
  if(!state.statuses) state.statuses = {};
  state.statuses[state.current] = 'skipped';
  state.skipped = (state.skipped || 0) + 1;
  state.current++;
  renderQuestion(lesson, state.current);
}

function selectAnswer(lesson, viewIndex, i){
  const state = practiceState[lesson.id];
  const item = state.shuffled[viewIndex];
  const opts = document.querySelectorAll('#optsWrap .opt');
  opts.forEach(o=> o.classList.add('disabled'));
  document.getElementById('optsWrap').classList.add('answered');
  opts[item.correct].classList.add('correct');
  if(!state.statuses) state.statuses = {};
  if(!state.picks) state.picks = {};
  state.picks[viewIndex] = i;
  if(i !== item.correct){ opts[i].classList.add('wrong'); state.statuses[viewIndex] = 'wrong'; }
  else { state.score++; state.statuses[viewIndex] = 'correct'; }
  document.getElementById('explainBox').classList.add('show');
  document.getElementById('nextBtn').classList.add('show');
  const skipRow = document.getElementById('skipRow');
  if(skipRow) skipRow.style.display = 'none';
  renderProgress(lesson, viewIndex);
}

function renderDone(lesson){
  const state = practiceState[lesson.id];
  renderProgress(lesson, null);
  const quizArea = document.getElementById('quizArea');
  const skippedCount = state.skipped || 0;
  quizArea.innerHTML = `
    <div class="q-card done-card">
      <div class="score">${state.score} / ${lesson.questions.length}</div>
      <p>Правильных ответов в теме «${lesson.title}»${skippedCount ? ` · пропущено: ${skippedCount}` : ''}</p>
      <p class="skip-hint">Нажми на полоску прогресса выше, чтобы посмотреть любой вопрос ещё раз</p>
      <button class="retry-btn" id="retryBtn">Пройти ещё раз</button>
    </div>
  `;
  saveProgress();
  refreshProgressUI();
  document.getElementById('retryBtn').addEventListener('click', ()=>{ state.current = 0; state.score = 0; state.skipped = 0; state.statuses = {}; state.picks = {}; state.shuffled = {}; renderQuestion(lesson, 0); });
}
